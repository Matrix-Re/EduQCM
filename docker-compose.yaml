services:
  db:
    image: mysql:8.0
    container_name: eduqcm_db
    env_file: backend/.env
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 750M
        reservations:
          memory: 200M
    logging:
      driver: "json-file"
      options:
        max-size: "10M"
        max-file: "3"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/database:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduqcm-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_node_modules:
