name: CI

on:
  push:
    branches:
      - main
      - v2

  pull_request:
    branches:
      - main

jobs:
  prettier:
    name: Vérification Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances racine
        run: npm ci

      - name: Vérifier le formatage
        run: npm run format:check

  backend-tests:
    name: Tests Jest backend
    runs-on: ubuntu-latest
    needs: prettier

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eduqcm_test

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@localhost:3306/eduqcm_test
      JWT_SECRET: github-actions-test-secret
      JWT_EXPIRES_IN: 1h

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances backend
        run: npm ci

      - name: Générer Prisma Client
        run: npx prisma generate

      - name: Initialize test database
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot eduqcm_test < ../docker/database/schema.sql

      - name: Lancer les tests Jest
        run: npm run test
